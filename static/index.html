<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12345 智能报表生成系统</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        h1 {
            font-size: 26px;
            margin: 0 0 16px 0;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 6px 18px rgba(0,0,0,.08);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        label {
            font-size: 14px;
            color: #333;
        }

        select, input, button {
            font-size: 14px;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #d0d7de;
            outline: none;
        }

        button {
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
        }
        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #dateWrapper, #yearWrapper {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        #loading {
            display: none;
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        #result-area {
            margin-top: 14px;
            line-height: 1.7;
            color: #111;
        }

        #result-area table {
            border-collapse: collapse;
            margin: 10px 0;
            width: 100%;
        }

        #result-area th, #result-area td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        #result-area th {
            background-color: #f6f8fa;
            text-align: left;
        }

        .hint {
            font-size: 13px;
            color: #666;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>12345 智能报表生成系统</h1>

    <div class="card">
        <div class="controls">
            <label for="reportType">报表类型：</label>
            <select id="reportType">
                <option value="daily" selected>日报（按日期）</option>
                <option value="heating">供暖季报告（按年度）</option>
                <option value="emergency">紧急敏感专报（按日期）</option>
            </select>

            <div id="dateWrapper">
                <label for="reportDate">日期：</label>
                <input type="date" id="reportDate" required>
            </div>

            <div id="yearWrapper" style="display:none;">
                <label for="heatingYear">供暖季年份：</label>
                <input type="number" id="heatingYear" min="2000" max="2100" placeholder="例如 2024">
            </div>

            <button id="generateBtn" onclick="generateReport()">生成日报</button>
        </div>

        <div id="loading">正在生成，请稍候...</div>
        <div id="result-area"></div>
        <div class="hint">说明：日报/紧急专报使用日期；供暖季报告使用年份（例如 2024 表示 2024-2025 供暖季）。</div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const typeSelect = document.getElementById('reportType');
        const dateWrapper = document.getElementById('dateWrapper');
        const yearWrapper = document.getElementById('yearWrapper');
        const btn = document.getElementById('generateBtn');

        typeSelect.addEventListener('change', () => {
            const v = typeSelect.value;
            if (v === 'daily') {
                dateWrapper.style.display = 'inline-flex';
                yearWrapper.style.display = 'none';
                btn.textContent = '生成日报';
            } else if (v === 'emergency') {
                dateWrapper.style.display = 'inline-flex';
                yearWrapper.style.display = 'none';
                btn.textContent = '生成紧急专报';
            } else {
                dateWrapper.style.display = 'none';
                yearWrapper.style.display = 'inline-flex';
                btn.textContent = '生成供暖报告';
            }
        });
    });

    async function generateReport() {
        const typeSelect = document.getElementById('reportType');
        const type = typeSelect.value;

        const btn = document.getElementById('generateBtn');
        const loading = document.getElementById('loading');
        const resultArea = document.getElementById('result-area');

        let url = '';
        let payload = {};

        if (type === 'daily') {
            const dateStr = document.getElementById('reportDate').value;
            if (!dateStr) {
                alert('请选择日期');
                return;
            }
            url = '/api/generate_report';
            payload = { date: dateStr };
        } else if (type === 'emergency') {
            const dateStr = document.getElementById('reportDate').value;
            if (!dateStr) {
                alert('请选择日期');
                return;
            }
            url = '/api/generate_emergency_report';
            payload = { date: dateStr };
        } else {
            const yearStr = document.getElementById('heatingYear').value;
            if (!yearStr) {
                alert('请输入供暖季年份，例如 2024');
                return;
            }
            const year = parseInt(yearStr, 10);
            if (Number.isNaN(year)) {
                alert('年份不合法');
                return;
            }
            url = '/api/generate_heating_report';
            payload = { year: year };
        }

        // UI 状态切换
        btn.disabled = true;
        loading.style.display = 'block';
        resultArea.innerHTML = '';

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            if (!data || typeof data.report !== 'string') {
                throw new Error('返回数据格式不正确');
            }

            // 使用 marked.js 将 Markdown 转换为 HTML
            resultArea.innerHTML = marked.parse(data.report);
        } catch (err) {
            console.error(err);
            alert('生成失败：' + (err && err.message ? err.message : err));
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
        }
    }
</script>
</body>
</html>
